# Same caching as the team server: the loader briefly (releases roll out in minutes),
# content-hashed app and font files forever.
map $uri $op_cache {
  ~^/openparley-(app|font)-  "public, max-age=31536000, immutable";
  ~^/openparley\.js          "public, max-age=300";
  ~^/brand/                  "public, max-age=86400";
  default                    "no-cache";
}

# The loader import()s the app from next to itself, which needs CORS when embedded elsewhere.
map $uri $op_cors {
  ~^/openparley  "*";
  default        "";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  # The privacy policy says we keep no logs of visits; the image's default would log every request with its IP.
  access_log off;
  charset utf-8;
  charset_types text/css application/javascript image/svg+xml text/plain text/markdown text/xml;
  # Behind Traefik: keep redirects relative instead of pointing at http://host:8080.
  absolute_redirect off;

  # Coolify routes www here without its own (temporary, 307) redirect, so the move is permanent.
  if ($host ~* ^www\.(.+)$) {
    return 301 https://$1$request_uri;
  }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json text/plain text/markdown;

  add_header Cache-Control $op_cache always;
  add_header Access-Control-Allow-Origin $op_cors always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # .dev is HSTS-preloaded as a TLD; this mainly satisfies scanners and covers a move off .dev.
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  # Crawlers and link previews ask for /favicon.ico regardless of <link rel=icon>.
  location = /favicon.ico {
    return 301 /brand/favicon.svg;
  }

  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }

  # Markdown copies of the docs for coding agents (llms.txt). nginx's mime.types doesn't know .md;
  # no add_header here, so the server-level headers still apply.
  location ~ \.md$ {
    default_type text/markdown;
  }
}
